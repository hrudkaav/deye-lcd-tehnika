# Automatic release: when deye-lcd-tehnika.js with a new version reaches main,
# this creates the tag vX.Y.Z and a GitHub release.
# The Marketplace (HACS) finds deye-lcd-tehnika.js among the release assets and then downloads
# EVERY asset of the release into the card's folder. So the assets are only what the card needs:
# the card file and the 3D-theme pictures (3d-*.webp), flat, side by side. No archives here —
# they would be copied into every user's folder too.
name: Release

on:
  push:
    branches: [main]
    paths:
      - deye-lcd-tehnika.js
      - assets/**
      - CHANGELOG.md
      - hacs.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from the card
        id: version
        run: |
          VERSION=$(grep -oP 'const version = "Alpha \K[0-9]+\.[0-9]+\.[0-9]+' deye-lcd-tehnika.js)
          if [ -z "$VERSION" ]; then echo "Version not found in deye-lcd-tehnika.js"; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Card version: $VERSION"

      - name: Stop if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p build
          # Notes: the CHANGELOG section of this version, up to the next «## » heading.
          awk -v v="$V" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > build/notes.md
          printf '\nВстановлення й оновлення: лише через Магазин (HACS) — Custom repositories → тип Dashboard.\n' >> build/notes.md
          cat build/notes.md

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.version }}
          gh release create "v$V" \
            --target "$GITHUB_SHA" \
            --title "Deye · LCD ТЕХНіКА v$V" \
            --notes-file build/notes.md \
            deye-lcd-tehnika.js assets/3d/*.webp
